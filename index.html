<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Labirin 37</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/4152/4152123.png" type="image/x-icon">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #f8fbf9;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    .container {
      width: 100%;
      height: 100vh;
      height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
    }
    .iframe-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #f8fbf9;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="iframe-container">
      <iframe
        id="appFrame"
        src=""
        allow="fullscreen; camera; microphone"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads allow-presentation">
      </iframe>
    </div>
  </div>

  <script>
    // =============================================
    // URL Google Apps Script Anda
    // =============================================
    var APP_URL = "https://script.google.com/macros/s/AKfycbyyGhIDG4imkisKgM7hDHibhySmP3l51gwATwO8TAe9m97Pew1flkXd6RbLH-la9LAf9w/exec";

    var appFrame = document.getElementById('appFrame');

    // =============================================
    // HANDLER REQUEST DARI IFRAME (postMessage)
    // =============================================
    window.addEventListener('message', function(event) {
      try {
        var data = event.data;
        if (!data || typeof data !== 'object') return;

        // Buka tab kosong (mis. untuk popup Google Form)
        if (data.action === 'openBlank') {
          window.open('', '_blank');
          return;
        }

        // Buka URL download
        if (data.action === 'openDownload' && data.url) {
          window.open(data.url, '_blank');
          return;
        }

        // Buka URL eksternal dengan noopener/noreferrer (lebih aman)
        if (data.action === 'openUrl' && data.url) {
          window.open(data.url, '_blank', 'noopener,noreferrer');
          return;
        }

        // Fullscreen request dari iframe
        if (data.action === 'requestFullscreen') {
          var el = document.documentElement;
          var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
          if (fn) fn.call(el).catch(function(){});
          return;
        }
      } catch(e) {
        console.warn('PostMessage error:', e);
      }
    });

    // =============================================
    // LOGIKA LOAD APLIKASI
    // =============================================
    function loadApp() {
      var targetUrl = APP_URL;
      var formId = '';

      // 1. Cek apakah ada path (contoh: form37.pages.dev/ID_FORM)
      var path = window.location.pathname;
      if (path && path.length > 1 && path !== '/') {
        formId = path.substring(1);
      }

      // 2. Cek apakah ada query ?id= (fallback)
      var params = new URLSearchParams(window.location.search);
      if (!formId && params.get('id')) {
        formId = params.get('id');
      }

      if (formId) {
        // Jika ada ID Form, paksa masuk ke halaman responden
        targetUrl += "?page=respond&id=" + formId;
        params.forEach(function(value, key) {
          if (key !== 'id' && key !== 'page') {
            targetUrl += "&" + key + "=" + encodeURIComponent(value);
          }
        });
      } else {
        // Jika tidak ada ID, buka halaman utama
        targetUrl += "?page=home";
      }

      appFrame.src = targetUrl;
    }

    window.addEventListener('DOMContentLoaded', loadApp);
  </script>
</body>
</html>
